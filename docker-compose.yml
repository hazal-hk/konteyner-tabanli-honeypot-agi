services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    ports:
      - "2222:2222"
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
    restart: unless-stopped

  processor:
    build: ./processor
    container_name: log-processor
    volumes:
      - cowrie-logs:/logs:ro
      - ./data:/data
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - cowrie
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data:ro
    depends_on:
      - processor
    restart: unless-stopped

volumes:
  cowrie-logs: